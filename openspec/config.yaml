# OpenSpec SDD Configuration — mcp-cad
# Auto-generated by sdd-init (2026-07-03)
# Do not destructively rewrite; update derived context only.

project: mcp-cad
strict_tdd: true

# openspec/specs/*.md at repo root are OBSOLETE (Python-era). See openspec/specs/DEPRECATED.md.
# Use openspec/changes/<change>/specs/ and src/McpCad.Core for C# truth.

stack:
  language: C# 12
  runtime: .NET 8.0
  tfm:
    default: net8.0
    windows: net8.0-windows
  build:
    command: dotnet build
    solution: null # No .sln; projects referenced directly
  multi_target: true # net8.0 (Linux) / net8.0 + net8.0-windows (Windows)

projects:
  - name: McpCad.Core
    path: src/McpCad.Core/McpCad.Core.csproj
    type: library
    tfm: net8.0
    deps: none # Zero NuGet dependencies (core protocol)
  - name: McpCad.Inventor
    path: src/McpCad.Inventor/McpCad.Inventor.csproj
    type: library
    tfm: net8.0-windows
    platform: windows # COM interop with Autodesk Inventor
  - name: McpCad.Onshape
    path: src/McpCad.Onshape/McpCad.Onshape.csproj
    type: library
    tfm: net8.0
    deps: Microsoft.Extensions.Http, Polly
  - name: McpCad.Tools
    path: src/McpCad.Tools/McpCad.Tools.csproj
    type: library
    tfm: net8.0
  - name: McpCad.Tools.Onshape
    path: src/McpCad.Tools/Onshape/McpCad.Tools.Onshape.csproj
    type: library
    tfm: net8.0
  - name: McpCad.Server
    path: src/McpCad.Server/McpCad.Server.csproj
    type: executable
    tfm: net8.0
  - name: McpCad.Installer
    path: src/McpCad.Installer/McpCad.Installer.csproj
    type: executable
    tfm: net8.0
    framework: Spectre.Console TUI

testing:
  runner: xUnit
  version: 2.5.3
  test_project: tests/McpCad.Tests/McpCad.Tests.csproj
  command: dotnet test tests/McpCad.Tests/
  frameworks:
    - net8.0 # All platforms
    - net8.0-windows # Windows-only tests (Inventor COM)
  assertions: FluentAssertions 8.10.0
  mocking: Moq 4.20.72
  http_mocking: WireMock.Net 1.7.4
  coverage: coverlet.collector 10.0.1
  strict_tdd: true
  pre_commit_test: true

conventions:
  code:
    language: C# with nullable enable, implicit usings
    naming: PascalCase for classes/methods, snake_case for MCP tool names
    root_namespace: McpCad
  sdd:
    changes_dir: openspec/changes/{change-name}/
    spec_dir: openspec/changes/{change-name}/specs/{spec-name}/
    artifacts:
      - exploration
      - proposal
      - spec
      - design
      - tasks
      - apply-progress
      - verify-report
      - judgment-day-report
      - 4r-summary
      - archive-report
    phase_order: [proposal, spec, design, tasks, apply, verify, archive]
    chained_prs: true # Used for >400-line changes
    delivery_strategies: [ask-on-risk, auto-chain, single-pr, exception-ok]
    chain_strategies: [stacked-to-main, feature-branch-chain]
  git:
    main_branch: main
    feature_prefix: feature/
    conventional_commits: true
    commit_types: [feat, fix, docs, refactor, chore, test]

providers:
  active: onshape # Current branch feature/onshape-provider
  registered:
    - name: inventor
      default: true
      platform: windows
      interface: IMechanicalCadProvider
      status: production
    - name: onshape
      interface: ICadWebProvider
      status: in_progress
      branch: feature/onshape-provider
    - name: solidworks
      interface: TBD
      status: planned
      branch: feature/solidworks-provider

risk_profile:
  max_lines_per_pr: 400
  review_trigger_lines: 400
  hot_paths:
    - auth/**
    - update/**
    - security/**
    - payments/**
  review_lenses: [risk, resilience, readability, reliability]
  judgment_day_phases: [design, apply]
